apiVersion: v1
kind: ConfigMap
metadata:
  name: bulletin-board-config
  namespace: bulletin-board
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://REPLACE_WITH_PRIVATE_DATABASE_HOST:25060/bulletins?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt"
  STORAGE_S3_BUCKET: "REPLACE_WITH_APPLICATION_BUCKET"
  STORAGE_S3_REGION: "fra1"
  STORAGE_S3_ENDPOINT: "https://fra1.digitaloceanspaces.com"
  MANAGEMENT_SERVER_PORT: "9090"
  MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: "readinessState,db"
  SERVER_SHUTDOWN: "graceful"
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: "20s"
  JAVA_OPTS: "-Xms128m -Xmx512m"
